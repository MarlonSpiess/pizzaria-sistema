# Teste de mutação (mutmut) só nas funções puras, com os testes de unidade (sem banco). Ver tools/README.md.
[mutmut]
source_paths=api/
do_not_mutate=
    api/routers/*
    api/schemas.py
    api/main.py
    api/config.py
    api/services/backup.py
    api/services/caixa.py
    api/services/canais.py
    api/services/compras.py
    api/services/contas.py
    api/services/custos.py
    api/services/estoque.py
    api/services/imobilizado.py
    api/services/ingredientes.py
    api/services/producao.py
    api/services/vendas.py
    api/services/varredor.py
    api/services/anotaai.py
pytest_add_cli_args_test_selection=tests_unidade/
also_copy=tests_unidade/
